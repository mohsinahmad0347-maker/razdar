<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RAZDAR — Your World. Your Choice. Premium e-commerce marketplace." />
  <title>RAZDAR — Your World. Your Choice.</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./src/css/main.css" />
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('razdar_theme')||'dark')}catch(e){}</script>

  <style>
    #app-loader{
      position:fixed;inset:0;z-index:9999;
      display:flex;align-items:center;justify-content:center;
      background:#080808;
      transition:opacity .5s ease,visibility .5s ease;
    }
    #app-loader.done{opacity:0;visibility:hidden;pointer-events:none;}
    body.loading{overflow:hidden;}
    .lw{display:flex;flex-direction:column;align-items:center;gap:28px;}
    .lr{position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center;}
    .lr svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
    .lr-bg{fill:none;stroke:#1a1a1a;stroke-width:2;}
    .lr-fg{fill:none;stroke:#C6FF00;stroke-width:2.5;stroke-linecap:round;
           stroke-dasharray:283;stroke-dashoffset:283;
           transition:stroke-dashoffset .2s ease;
           filter:drop-shadow(0 0 8px rgba(198,255,0,.5));}
    .ll{font-family:'Outfit',sans-serif;font-size:1.8rem;font-weight:900;letter-spacing:.1em;
        background:linear-gradient(135deg,#C6FF00,#DDFF80);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .lb{width:200px;}
    .lb-t{height:3px;background:#1a1a1a;border-radius:999px;overflow:hidden;}
    .lb-f{height:100%;width:0;background:linear-gradient(90deg,#C6FF00,#DDFF80);
          border-radius:999px;transition:width .12s ease;box-shadow:0 0 8px rgba(198,255,0,.4);}
    .lp{font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;color:#C6FF00;text-align:center;margin-top:4px;}
    .lt{font-family:'Inter',sans-serif;font-size:11px;color:#555;letter-spacing:.05em;}
    .ld{display:flex;gap:6px;}
    .ld span{width:6px;height:6px;border-radius:50%;background:#C6FF00;opacity:.3;
             animation:ldot 1.2s ease-in-out infinite;}
    .ld span:nth-child(2){animation-delay:.2s;}
    .ld span:nth-child(3){animation-delay:.4s;}
    @keyframes ldot{0%,80%,100%{opacity:.3;transform:scale(1)}40%{opacity:1;transform:scale(1.3)}}
  </style>
</head>
<body class="loading">

  <div id="app-loader">
    <div class="lw">
      <div class="lr">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" class="lr-bg"/>
          <circle cx="50" cy="50" r="45" class="lr-fg" id="lrfg"/>
        </svg>
        <div class="ll">RAZDAR</div>
      </div>
      <div class="lb">
        <div class="lb-t"><div class="lb-f" id="lbf"></div></div>
        <div class="lp" id="lpct">0%</div>
      </div>
      <div class="lt">Your World. Your Choice.</div>
      <div class="ld"><span></span><span></span><span></span></div>
    </div>
  </div>

  <nav id="navbar"></nav>
  <div id="search-overlay"></div>
  <main id="app"></main>
  <footer id="footer"></footer>
  <div id="bottom-nav"></div>
  <div id="chat-widget"></div>
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-container"></div>

  <script type="module" src="./src/js/main.js"></script>

  <script>
    /* Loader animation — purely visual, does NOT gate the router.
       The router starts immediately when main.js is ready (no waiting). */
    (function(){
      var p=0, bar=document.getElementById('lbf'),
          pct=document.getElementById('lpct'),
          ring=document.getElementById('lrfg'),
          el=document.getElementById('app-loader'),
          gone=false;

      function hide(){
        if(gone)return; gone=true;
        el.classList.add('done');
        document.body.classList.remove('loading');
      }

      var iv=setInterval(function(){
        p+=Math.floor(Math.random()*10)+4;
        if(p>=100){p=100;clearInterval(iv);}
        if(bar) bar.style.width=p+'%';
        if(pct) pct.textContent=p+'%';
        if(ring) ring.style.strokeDashoffset=String(283-283*p/100);
        if(p>=100) setTimeout(hide,400);
      },50);

      /* Hard fallback — hide after 3.5s no matter what */
      setTimeout(hide,3500);

      /* Also hide as soon as main.js signals it's ready */
      window.__razdarHideLoader=hide;
    })();
  </script>
</body>
</html>
