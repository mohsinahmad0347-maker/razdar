<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RAZDAR — Your World. Your Choice. Premium e-commerce marketplace for electronics, fashion, lifestyle and more." />
  <meta name="keywords" content="RAZDAR, ecommerce, online shopping, electronics, fashion, deals" />
  <meta name="author" content="RAZDAR" />
  <title>RAZDAR — Your World. Your Choice.</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- DNS prefetch + preconnect for Google Fonts (non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!--
    Load Google Fonts asynchronously so they never block first paint.
    media="print" trick: browser downloads in background, then onload
    switches media to "all" so fonts apply without render-blocking.
  -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <!-- Fallback for browsers with JS disabled -->
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    />
  </noscript>

  <!-- App styles — loaded normally (critical path CSS) -->
  <link rel="stylesheet" href="./src/css/main.css" />

  <!--
    Inline critical theme so there's zero flash of wrong theme.
    Reads localStorage before any JS executes.
  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('razdar_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <!-- Premium Loader -->
  <div id="app-loader" class="app-loader">
    <div class="loader-content">
      <div class="loader-logo-wrap">
        <div class="loader-ring">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" class="loader-ring-bg" />
            <circle cx="50" cy="50" r="45" class="loader-ring-fill" />
          </svg>
        </div>
        <div class="loader-logo">
          <span class="logo-r">R</span><span class="logo-a">A</span><span class="logo-z">Z</span><span class="logo-d">D</span><span class="logo-a2">A</span><span class="logo-r2">R</span>
        </div>
      </div>
      <div class="loader-progress">
        <div class="loader-progress-bar"><div class="loader-progress-fill"></div></div>
        <span class="loader-percent">0%</span>
      </div>
      <p class="loader-tagline">Your World. Your Choice.</p>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <nav id="navbar"></nav>

  <!-- Search Overlay -->
  <div id="search-overlay"></div>

  <!-- Main Content -->
  <main id="app"></main>

  <!-- Footer -->
  <footer id="footer"></footer>

  <!-- Bottom Nav (Mobile) -->
  <div id="bottom-nav"></div>

  <!-- Chat Widget -->
  <div id="chat-widget"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Main JS — type module means it's deferred automatically -->
  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
